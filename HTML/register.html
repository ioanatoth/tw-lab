<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required>
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: exemplu@mail.com" required>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row">
                    <label>Gen</label>
                    <div class="checkbox-grid">
                        <label><input type="radio" name="gender" value="masculin"> Masculin</label>
                        <label><input type="radio" name="gender" value="feminin"> Feminin</label>
                        <label><input type="radio" name="gender" value="altul"> Altul</label>
                    </div>
                </div>

                <div class="row">
                    <label for="role">Tip cont</label>
                    <select id="role" name="role">
                        <option value="student">Student</option>
                        <option value="profesor">Profesor</option>
                    </select>
                </div>

                <div class="row">
                    <label>Interese</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
                        <label><input type="checkbox" name="interests" value="backend"> Backend</label>
                        <label><input type="checkbox" name="interests" value="uxui"> UI/UX</label>
                        <label><input type="checkbox" name="interests" value="js"> JavaScript</label>
                    </div>
                </div>

                <div class="row">
                    <label for="avatar">Încarcă avatar</label>
                    <input type="file" id="avatar" name="avatar">
                </div>

                <div class="row">
                    <label for="bio">Scurtă descriere</label>
                    <textarea id="bio" name="bio" rows="3"></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Înregistrare</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>

                <p class="login-link">
                    Ai deja cont? <a href="login.html">Mergi la login</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
