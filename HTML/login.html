<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="../MEDIA/logo.png" alt="Imagine login">
        </div>
        <div class="separator"></div>
        <div class="login-form">
            <h2>Login</h2>
            <!-- Unicul formular care încorporează elementele stilizate -->
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Parola" required>
                <button type="submit">Login</button>
            </form>
            <p class="register-text">
                Nu ai cont? <a href="register.html">Înregistrează-te</a>
            </p>
        </div>
    </div>
    <script src="../JS/login_js.js"></script>
</body>
</html>
